aid: bending-spoons
name: Bending Spoons
description: 'Bending Spoons S.p.A. is a Milan, Italy technology company founded in
  2013 that acquires established digital products and operates them for the long term
  rather than reselling them. Its portfolio spans more than 50 acquisitions and includes
  AOL, Brightcove, Eventbrite, Evernote, Harvest, Issuu, komoot, Loomly, Meetup, Remini,
  Splice, StreamYard, Tractive, Vimeo and WeTransfer, serving over 500 million monthly
  active users and more than 9 million monthly paying customers. The company listed
  its ordinary shares on the Nasdaq Global Select Market under the ticker BSP on 1
  July 2026. Bending Spoons itself publishes no public developer API, API documentation,
  or developer portal at the holding-company level: every API surface in the group
  belongs to an individual acquired product, each profiled separately in the API Evangelist
  network. What the corporate entity does publish is a PGP-signed RFC 9116 security.txt,
  a compliance hub, a support center, an investor relations site, and a small set of
  first-party open-source Swift frameworks (Katana, Tempura).'
